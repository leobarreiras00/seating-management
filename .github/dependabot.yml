version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directory: /backend/SeatingManagement.API
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directory: /backend/SeatingManagement.API.Tests
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /backend/SeatingManagement.API
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /backoffice
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directory: /frontend/SeatingManagementApp
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
